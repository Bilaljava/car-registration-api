spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cars_db?createDatabaseIfNotExist=true
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

